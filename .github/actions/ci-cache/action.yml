name: "CI prebuild cache"
description: |
  Compute content hash of go.mod+go.sum, restore Go build cache and
  Docker deps-stage image tarball, run mise prebuild, then save caches
  on miss.  All heavy lifting for the dependency-prebuild phase.

runs:
  using: "composite"
  steps:
    - name: Compute prebuild cache key
      id: prebuild
      shell: bash
      env:
        MISE_TASK_OUTPUT: quiet
      run: echo "key=$(mise run prebuild-hash)" >> $GITHUB_OUTPUT

    - name: Restore prebuild cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/go-build
          ~/.local/go/pkg/mod
          /tmp/docker-deps.tar
        key: prebuild-${{ steps.prebuild.outputs.key }}

    - name: Load cached Docker deps image
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i /tmp/docker-deps.tar || true

    - name: Run prebuild (downloads modules, builds deps, tags docker image)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: mise run prebuild

    - name: Save Docker deps image
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker save "infogulch/xtemplate:deps" -o /tmp/docker-deps.tar || true

    - name: Save prebuild cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/go-build
          ~/.local/go/pkg/mod
          /tmp/docker-deps.tar
        key: prebuild-${{ steps.prebuild.outputs.key }}
